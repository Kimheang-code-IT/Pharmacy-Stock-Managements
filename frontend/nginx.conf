# Frontend container: serve the static Nuxt SPA and reverse-proxy the API.
# TLS is terminated by a host reverse proxy (see infrastructure/nginx/), so this
# server only listens on plain HTTP inside the Docker network.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hide the nginx version in responses/error pages.
    server_tokens off;

    # Emit relative redirects so a non-default published port is preserved
    # (an absolute 301 would drop the port and land the browser on the wrong host).
    absolute_redirect off;

    # Product images / logos are uploaded through the API proxy.
    client_max_body_size 32m;

    # ------------------------------------------------------------------ gzip
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/rss+xml
        application/manifest+json
        application/wasm
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # ------------------------------------------------------- security headers
    # NOTE: nginx does not inherit server-level `add_header` into a location
    # that declares its own `add_header`. Locations below therefore only use
    # `expires` (which does not break inheritance), so every response keeps
    # these headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # Docker embedded DNS. A variable proxy_pass re-resolves `api` after the
    # API container is recreated (a static upstream would pin the old IP).
    resolver 127.0.0.11 ipv6=off valid=10s;

    # --------------------------------------------------------------- API proxy
    # `^~` stops the regex static-cache location below from matching API URLs
    # that end in an image extension. Product image downloads live at
    # /api/v1/images/images/... .png|.webp etc.; without `^~` that regex wins
    # and nginx serves a static 404 instead of proxying to the API.
    location ^~ /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Readiness/liveness probe (GET /health/ready) for the host proxy / monitors.
    location ^~ /health/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # ------------------------------------------------------------- static cache
    # Content-hashed build output — safe to cache forever.
    location /_nuxt/ {
        try_files $uri =404;
        expires 1y;
    }

    # Self-hosted fonts.
    location /_fonts/ {
        try_files $uri =404;
        expires 1y;
    }

    # Public images / icons / fonts (logo.png, og-image.png, …).
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot)$ {
        try_files $uri =404;
        expires 30d;
    }

    # Never cache the SPA shell: a new deploy must be picked up immediately.
    location = /index.html {
        expires -1;
    }
    location = /200.html {
        expires -1;
    }
    location = /404.html {
        expires -1;
    }

    # --------------------------------------------------------------- SPA routing
    # Allow ACME http-01 challenges when this container is the TLS terminator.
    location ^~ /.well-known/ {
        allow all;
    }

    # Block dotfiles (except .well-known handled above).
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Client-side routing: real files win, otherwise serve the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
