# ============================================================================
# Stock & POS — optional HTTPS reverse proxy for a HOST nginx in front of the
# Docker stack (TLS termination). The stack's frontend container already serves
# the SPA and proxies /api and /health to the API, so this proxy only forwards
# to it.
#
# Install (on the host that runs nginx):
#   1. Copy this file to e.g. /etc/nginx/conf.d/stock-pos.conf
#   2. Replace pos.example.com with your domain (both server_name lines and the
#      ssl_certificate* paths).
#   3. Issue certificates, e.g. with certbot:
#        sudo certbot certonly --webroot -w /var/www/certbot -d pos.example.com
#      (certbot's webroot must match the `root` in the HTTP block below).
#   4. nginx -t && systemctl reload nginx
#
# The upstream is the frontend container's published port, i.e. FRONTEND_BIND +
# FRONTEND_PORT from infrastructure/.env (default 127.0.0.1:80). If you changed
# FRONTEND_PORT, update `proxy_pass` below to match.
# ============================================================================

# HTTP: ACME http-01 challenge passthrough + permanent redirect to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name pos.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: TLS termination, HSTS, then proxy to the frontend container.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;  # nginx >= 1.25.1; on older builds use: listen 443 ssl http2;
    server_name pos.example.com;

    # ---------------------------------------------------------------- TLS
    ssl_certificate     /etc/letsencrypt/live/pos.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ------------------------------------------------------- security headers
    # HSTS is only ever sent over HTTPS, so it is safe to set here (never on the
    # plain-HTTP block above). The container nginx adds the rest.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Product image uploads go through the API proxy.
    client_max_body_size 32m;

    # ------------------------------------------------------ frontend upstream
    # The frontend container nginx serves the SPA and proxies /api + /health.
    location / {
        proxy_pass http://127.0.0.1:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Optional: lightweight readiness probe without access-log noise.
    location = /health/ready {
        proxy_pass http://127.0.0.1:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }
}
