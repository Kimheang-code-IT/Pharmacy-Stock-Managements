# Stock & POS Management System — single lean Compose stack.
#
# Services: db, redis, api, frontend, telegram-bot. Nothing else.
# No RabbitMQ and no Celery workers: every scheduled job (expiry alerts, daily
# summary) runs inside the API process, and Telegram delivery is in-process.
#
# All infrastructure lives in this `infrastructure/` folder. Every command is
# meant to run **from here** (this directory), where `.env` also lives:
#   cd infrastructure
#   docker compose up -d --build          # build images and start
#   docker compose up -d                  # start (images already built)
#   docker compose down                   # stop (volumes preserved)
#
# Local-only Windows production (single PC; binds 127.0.0.1 by default):
#   double-click "Start Stock POS.bat" in the infrastructure folder.
#
# Production on another host from prebuilt GHCR images (no local build):
#   set IMAGE_REGISTRY / IMAGE_TAG / PULL_POLICY=always in `.env`, then
#   docker compose pull && docker compose up -d
#
# Image names default to the local build (IMAGE_REGISTRY=stock_pos). Set
# IMAGE_REGISTRY=ghcr.io/kimheang-code-it/stock_pos and PULL_POLICY=always in
# `.env` to use registry images instead.
#
# Backend tests (python -m pytest backend/tests) use the host-loopback,
# 127.0.0.1-published dev ports below: PostgreSQL 55432 and Redis 56379
# (see backend/tests/conftest.py).

# Pin the Compose project name and explicit container/volume names so they are
# stable and friendly regardless of the checkout folder. Override the project
# name with COMPOSE_PROJECT_NAME in `.env`.
name: stock-management

x-api-build: &api-build
  image: ${IMAGE_REGISTRY:-stock_pos}/api:${IMAGE_TAG:-local}
  pull_policy: ${PULL_POLICY:-build}
  build:
    context: ../backend
    dockerfile: Dockerfile

services:
  db:
    container_name: stock-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stock_pos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock_pos}
      POSTGRES_DB: ${POSTGRES_DB:-stock_pos}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Loopback only: reachable by backend tests on this PC, not the LAN.
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stock_pos} -d ${POSTGRES_DB:-stock_pos}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    container_name: stock-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      # Loopback only: reachable by backend tests on this PC, not the LAN.
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *api-build
    container_name: stock-api
    restart: unless-stopped
    ports:
      # Loopback only: API docs / direct calls from this PC (frontend nginx
      # proxies /api and /health too).
      - "127.0.0.1:${API_HOST_PORT:-8100}:8000"
    volumes:
      - mediadata:/srv/data/media
      # Private maintenance/reset snapshots — NOT under the public media root.
      - backupdata:/srv/data/backups
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-stock_pos}:${POSTGRES_PASSWORD:-stock_pos}@db:5432/${POSTGRES_DB:-stock_pos}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-secret-change-me-in-production-0123456789abcdef}
      # 24-hour access token so users stay signed in through the day.
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}

      # Telegram bot token / group ID live in Administration > Settings (DB).
      LOCAL_STORAGE_DIR: /srv/data/media
      BACKUP_DIR: /srv/data/backups
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:80,http://127.0.0.1:80}
      CORS_ALLOW_PRIVATE_NETWORKS: ${CORS_ALLOW_PRIVATE_NETWORKS:-false}
      SEED_ADMIN_ENABLED: ${SEED_ADMIN_ENABLED:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@gmail.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-123456}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-System Administrator}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Deep health: only "ok" when PostgreSQL and Redis respond.
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    container_name: stock-nginx
    image: ${IMAGE_REGISTRY:-stock_pos}/frontend:${IMAGE_TAG:-local}
    pull_policy: ${PULL_POLICY:-build}
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-same-origin}
        NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-}
        NUXT_PUBLIC_APP_VERSION: ${NUXT_PUBLIC_APP_VERSION:-1.0.0}
    restart: unless-stopped
    ports:
      # Bind address defaults to this PC only; set FRONTEND_BIND=0.0.0.0 (or a
      # LAN IP) in `.env` to expose the app on the network.
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 5

  telegram-bot:
    container_name: stock-telegram-bot
    image: ${IMAGE_REGISTRY:-stock_pos}/telegram-bot:${IMAGE_TAG:-local}
    pull_policy: ${PULL_POLICY:-build}
    build:
      context: ../backend
      dockerfile: Dockerfile.telegram
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-stock_pos}:${POSTGRES_PASSWORD:-stock_pos}@db:5432/${POSTGRES_DB:-stock_pos}
      REDIS_URL: redis://redis:6379/0
      # Telegram bot token / group ID are read from Administration > Settings
      # (system_settings) at runtime; no environment configuration needed.
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      # Liveness only: the poller has no HTTP port. Re-checks the saved token
      # every few seconds, so a Settings change needs no container restart.
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------- backups
  # One-shot helpers, only run explicitly (profile "tools"):
  #   docker compose --profile tools run --rm backup
  #   docker compose --profile tools run --rm media-backup
  # They write timestamped artifacts into ./backups (git-ignored).
  backup:
    image: postgres:16-alpine
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-stock_pos}
      PGPASSWORD: ${POSTGRES_PASSWORD:-stock_pos}
      PGDATABASE: ${POSTGRES_DB:-stock_pos}
    volumes:
      - ./backups:/backups
    entrypoint: ["sh", "-c"]
    # Custom-format dump (pg_restore-compatible) with a timestamped name.
    command: >
      'pg_dump -Fc -f "/backups/stock_pos_$(date -u +%Y%m%dT%H%M%SZ).dump" &&
       ls -lh /backups'

  media-backup:
    image: alpine:3.20
    profiles: ["tools"]
    volumes:
      - mediadata:/media:ro
      - ./backups:/backups
    entrypoint: ["sh", "-c"]
    command: >
      'tar czf "/backups/media_$(date -u +%Y%m%dT%H%M%SZ).tgz" -C /media . &&
       ls -lh /backups'

volumes:
  pgdata:
    name: stock-pgdata
  redisdata:
    name: stock-redisdata
  mediadata:
    name: stock-mediadata
  backupdata:
    name: stock-backupdata
