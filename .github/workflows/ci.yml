name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stock_pos
          POSTGRES_PASSWORD: stock_pos
          POSTGRES_DB: stock_pos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stock_pos -d stock_pos"
          --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://stock_pos:stock_pos@localhost:5432/stock_pos_test
      REDIS_URL: redis://localhost:6379/5
      SEED_ADMIN_ENABLED: "true"
      SCHEDULER_ENABLED: "false"
      ENVIRONMENT: development
      DEBUG: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app
      - name: Production config safety check
        env:
          ENVIRONMENT: production
          DEBUG: "false"
          CORS_ALLOW_PRIVATE_NETWORKS: "false"
          JWT_SECRET_KEY: "ci-only-strong-jwt-secret-0123456789abcdefghijklmnop"
          SEED_ADMIN_ENABLED: "false"
        run: |
          python - <<'PY'
          from app.core.config import Settings
          Settings().assert_safe_for_production()
          print("production config is safe")
          PY
      - name: Tests
        run: python -m pytest tests -q

  alembic:
    name: Alembic (single head + empty-DB upgrade)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stock_pos
          POSTGRES_PASSWORD: stock_pos
          POSTGRES_DB: stock_pos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stock_pos -d stock_pos"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://stock_pos:stock_pos@localhost:5432/stock_pos_ci
      ENVIRONMENT: development
      DEBUG: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Create the empty database
        run: PGPASSWORD=stock_pos psql -h localhost -U stock_pos -d postgres -c "CREATE DATABASE stock_pos_ci"
      - name: Upgrade from empty
        run: python -m alembic upgrade head
      - name: Exactly one head
        run: |
          heads=$(python -m alembic heads | grep -c '(head)')
          echo "heads=$heads"
          test "$heads" -eq 1

  frontend:
    name: Frontend (test + typecheck + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare Nuxt
        run: pnpm prepare:nuxt
      - name: Tests
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      # Static build is slow and only needed for deploys, so skip it on PRs
      # (runs on main pushes and manual dispatch).
      - name: Build
        if: github.ref == 'refs/heads/main'
        run: pnpm build
