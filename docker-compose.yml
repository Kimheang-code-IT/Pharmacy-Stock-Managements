# Stock & POS Management System — lean default stack. Run from the repository root.
#
# Default (low resource, high performance): PostgreSQL + Redis + API + frontend.
# Images are stored on a local volume. Expiry alerts run inside the API process.
# S3/MinIO, RabbitMQ, Celery workers, and a scheduler container are not used.
#
#   docker compose up -d --build
#
# Optional later (more RAM/CPU):
#   docker compose --profile queue --profile telegram up -d
#
# Production on another host (pull images published to GHCR):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Image names default to ghcr.io/kimheang-code-it/stock_pos/{api,frontend,telegram-bot}.
# Override with IMAGE_REGISTRY and IMAGE_TAG in `.env`.
#
# Backend tests (python -m pytest backend/tests) use the host-published dev
# ports below: PostgreSQL 55432 and Redis 56379 (see backend/tests/conftest.py).

x-api-build: &api-build
  image: ${IMAGE_REGISTRY:-ghcr.io/kimheang-code-it/stock_pos}/api:${IMAGE_TAG:-local}
  pull_policy: ${PULL_POLICY:-build}
  build:
    context: ./backend
    dockerfile: Dockerfile

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stock_pos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock_pos}
      POSTGRES_DB: ${POSTGRES_DB:-stock_pos}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stock_pos} -d ${POSTGRES_DB:-stock_pos}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    profiles: ["queue"]
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-stock_pos}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-stock_pos}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-stock_pos}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
      - ./backend/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    <<: *api-build
    restart: unless-stopped
    ports:
      # Host port is configurable to avoid clashes with other local stacks.
      - "${API_HOST_PORT:-8100}:8000"
    volumes:
      - mediadata:/srv/data/media
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-stock_pos}:${POSTGRES_PASSWORD:-stock_pos}@db:5432/${POSTGRES_DB:-stock_pos}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-secret-change-me-in-production-0123456789abcdef}
      TELEGRAM_BOT_CLIENT_ID: ${TELEGRAM_BOT_CLIENT_ID:-stock-pos-telegram-bot}
      TELEGRAM_BOT_CLIENT_SECRET: ${TELEGRAM_BOT_CLIENT_SECRET:-dev-only-telegram-secret-change-me-0123456789abcdef}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      LOCAL_STORAGE_DIR: /srv/data/media
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:80,http://127.0.0.1:80,http://localhost:3000,http://127.0.0.1:3000}
      CORS_ALLOW_PRIVATE_NETWORKS: ${CORS_ALLOW_PRIVATE_NETWORKS:-true}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@gmail.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-123456}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-System Administrator}
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # Frontend container stays defined for the future Nuxt UI; the backend stack
  # is fully functional without it and it is NOT required for acceptance.
  frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io/kimheang-code-it/stock_pos}/frontend:${IMAGE_TAG:-local}
    pull_policy: ${PULL_POLICY:-build}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-same-origin}
        NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-}
        NUXT_PUBLIC_APP_VERSION: ${NUXT_PUBLIC_APP_VERSION:-1.0.0}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 5

  worker-default:
    profiles: ["queue"]
    <<: *api-build
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker -Q reports,maintenance --loglevel=INFO
    healthcheck:
      test: ["CMD", "celery", "-A", "app.tasks.celery_app", "inspect", "ping", "--timeout", "15"]
      interval: 30s
      timeout: 20s
      start_period: 40s
      retries: 5
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-stock_pos}:${POSTGRES_PASSWORD:-stock_pos}@db:5432/${POSTGRES_DB:-stock_pos}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-stock_pos}:${RABBITMQ_PASSWORD:-stock_pos}@rabbitmq:5672/${RABBITMQ_VHOST:-stock_pos}
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-stock_pos}:${RABBITMQ_PASSWORD:-stock_pos}@rabbitmq:5672/${RABBITMQ_VHOST:-stock_pos}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker-telegram:
    profiles: ["queue"]
    <<: *api-build
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker -Q critical,telegram --concurrency=2 --loglevel=INFO
    healthcheck:
      test: ["CMD", "celery", "-A", "app.tasks.celery_app", "inspect", "ping", "--timeout", "15"]
      interval: 30s
      timeout: 20s
      start_period: 40s
      retries: 5
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-stock_pos}:${POSTGRES_PASSWORD:-stock_pos}@db:5432/${POSTGRES_DB:-stock_pos}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-stock_pos}:${RABBITMQ_PASSWORD:-stock_pos}@rabbitmq:5672/${RABBITMQ_VHOST:-stock_pos}
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker-export:
    profiles: ["queue"]
    <<: *api-build
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker -Q exports --concurrency=2 --loglevel=INFO
    healthcheck:
      test: ["CMD", "celery", "-A", "app.tasks.celery_app", "inspect", "ping", "--timeout", "15"]
      interval: 30s
      timeout: 20s
      start_period: 40s
      retries: 5
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-stock_pos}:${POSTGRES_PASSWORD:-stock_pos}@db:5432/${POSTGRES_DB:-stock_pos}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-stock_pos}:${RABBITMQ_PASSWORD:-stock_pos}@rabbitmq:5672/${RABBITMQ_VHOST:-stock_pos}
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      EXPORT_DIR: /srv/data/exports
    volumes:
      - exportdata:/srv/data/exports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  telegram-bot:
    profiles: ["telegram"]
    image: ${IMAGE_REGISTRY:-ghcr.io/kimheang-code-it/stock_pos}/telegram-bot:${IMAGE_TAG:-local}
    pull_policy: ${PULL_POLICY:-build}
    build:
      context: ./backend
      dockerfile: Dockerfile.telegram
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_MODE: ${TELEGRAM_BOT_MODE:-polling}
      TELEGRAM_BOT_CLIENT_ID: ${TELEGRAM_BOT_CLIENT_ID:-stock-pos-telegram-bot}
      TELEGRAM_BOT_CLIENT_SECRET: ${TELEGRAM_BOT_CLIENT_SECRET:-dev-only-telegram-secret-change-me-0123456789abcdef}
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  exportdata:
  mediadata:
