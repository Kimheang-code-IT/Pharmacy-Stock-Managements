# RabbitMQ node configuration for Stock & POS.
# Credentials and vhost are provisioned via RABBITMQ_DEFAULT_* environment
# variables in docker-compose.yml; do not commit secrets here.
vm_memory_high_watermark.relative = 0.6

# Celery 5.4 declares transient remote-control (pidbox) queues, which RabbitMQ 4
# no longer permits by default. This flag is the documented compatibility switch.
deprecated_features.permit.transient_nonexcl_queues = true
